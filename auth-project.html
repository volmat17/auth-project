<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth-project — дневник наставничества (Go)</title>
<style>
:root {
  --bg: #f5f6f8; --bg-elevated: #ffffff; --fg: #1c1f24; --fg-muted: #5b6270;
  --border: #e2e5ea; --accent: #2e6ee0; --accent-fg: #ffffff; --accent-soft: #e8f0fe;
  --success: #1f9d55; --success-soft: #e5f7ec; --warn: #b5750a; --warn-soft: #fdf1de;

}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --bg-elevated: #1c1f25; --fg: #e7e9ee; --fg-muted: #9aa1ad;
    --border: #2a2d34; --accent: #5b8def; --accent-fg: #0d1117; --accent-soft: #1c2a42;
    --success: #3fbf72; --success-soft: #16281d; --warn: #e0a530; --warn-soft: #2c220f;
    --danger: #ef5b52; --card-bg: #1c1f25; --code-bg: #23262c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 12px rgba(0,0,0,0.25);
  }
}
:root[data-theme="light"] {
  --bg: #f5f6f8; --bg-elevated: #ffffff; --fg: #1c1f24; --fg-muted: #5b6270;
  --border: #e2e5ea; --accent: #2e6ee0; --accent-fg: #ffffff; --accent-soft: #e8f0fe;
  --success: #1f9d55; --success-soft: #e5f7ec; --warn: #b5750a; --warn-soft: #fdf1de;
  --danger: #d0342c; --card-bg: #ffffff; --code-bg: #f0f1f4;
  --shadow: 0 1px 2px rgba(20,20,30,0.06), 0 1px 8px rgba(20,20,30,0.04);
}
:root[data-theme="dark"] {
  --bg: #14161a; --bg-elevated: #1c1f25; --fg: #e7e9ee; --fg-muted: #9aa1ad;
  --border: #2a2d34; --accent: #5b8def; --accent-fg: #0d1117; --accent-soft: #1c2a42;
  --success: #3fbf72; --success-soft: #16281d; --warn: #e0a530; --warn-soft: #2c220f;
  --danger: #ef5b52; --card-bg: #1c1f25; --code-bg: #23262c;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 12px rgba(0,0,0,0.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px; line-height: 1.6; min-height: 100vh;
}
h2, h3 { margin: 0 0 .5em; font-weight: 650; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
button, textarea { font-family: inherit; }
code {
  background: var(--code-bg); padding: .1em .4em; border-radius: 5px;
  font-size: .9em; font-family: "SF Mono", Consolas, Menlo, monospace;
}
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; overflow-x: auto; margin: 0 0 .8em;
}
pre code { background: none; padding: 0; font-size: .88em; }

.app-shell {
  display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr;
  grid-template-areas: "header header" "sidebar main"; min-height: 100vh;
}
header.top-bar {
  grid-area: header; display: flex; align-items: center; gap: 16px; padding: 12px 20px;
  background: var(--bg-elevated); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
}
header.top-bar h1 { font-size: 17px; margin: 0; white-space: nowrap; }
.overall-progress { flex: 1; display: flex; align-items: center; gap: 10px; max-width: 420px; }
.overall-progress .bar { flex: 1; }
.overall-progress .pct { font-size: 13px; color: var(--fg-muted); white-space: nowrap; }
.bar { height: 8px; background: var(--code-bg); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 999px; transition: width .25s ease; }
.theme-toggle {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  width: 36px; height: 36px; font-size: 16px; display: flex; align-items: center; justify-content: center;
}

aside.sidebar {
  grid-area: sidebar; background: var(--bg-elevated); border-right: 1px solid var(--border);
  padding: 16px 10px; overflow-y: auto;
}
.step-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
  cursor: pointer; margin-bottom: 4px; border: 1px solid transparent;
}
.step-item:hover { background: var(--code-bg); }
.step-item.active { background: var(--accent-soft); border-color: var(--accent); }
.step-item .num {
  width: 24px; height: 24px; border-radius: 50%; background: var(--code-bg); color: var(--fg-muted);
  display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; font-weight: 650;
}
.step-item.done .num { background: var(--success); color: #fff; }
.step-item.current .num { background: var(--accent); color: var(--accent-fg); }
.step-item .label { font-size: 13.5px; }
.step-item .status-tag {
  margin-left: auto; font-size: 10.5px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .03em;
}

main.content { grid-area: main; padding: 28px 40px 60px; }
.step-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.badge {
  font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 650; text-transform: uppercase; letter-spacing: .03em;
}
.badge.done { background: var(--success-soft); color: var(--success); }
.badge.current { background: var(--accent-soft); color: var(--accent); }
.badge.todo { background: var(--code-bg); color: var(--fg-muted); }
.summary { color: var(--fg-muted); margin-bottom: 20px; }
.card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);

.card h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-muted); }
.card ol, .card ul { margin: 0; padding-left: 20px; }
.card li { margin-bottom: 6px; }
.snippet-note { color: var(--fg-muted); font-size: 14px; }
.chk { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; cursor: pointer; }
.chk input { margin-top: 3px; }
.chk.checked span { color: var(--fg-muted); text-decoration: line-through; }
textarea.notes {
  width: 100%; min-height: 90px; background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px; color: var(--fg); resize: vertical; font-size: 14px;
}
.verify { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--radius); padding: 14px 16px; }
.verify h3 { color: var(--warn); }
.nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; }
.nav-buttons button {
  background: var(--accent); color: var(--accent-fg); border: none; border-radius: 8px;
  padding: 9px 16px; font-size: 14px; cursor: pointer;
}
.nav-buttons button:disabled { opacity: .4; cursor: default; }
.nav-buttons button.secondary { background: var(--code-bg); color: var(--fg); border: 1px solid var(--border); }

.live-indicator { font-size: 11px; color: var(--success); white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.live-indicator .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(31,157,85,.4); }
  70% { box-shadow: 0 0 0 6px rgba(31,157,85,0); }
  100% { box-shadow: 0 0 0 0 rgba(31,157,85,0); }
}

.tab-switcher { display: flex; gap: 6px; margin-bottom: 14px; padding: 0 2px; }
.tab-btn { flex: 1; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--code-bg); color: var(--fg-muted); font-size: 12.5px; cursor: pointer; }
.tab-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.chat-thread { display: flex; flex-direction: column; gap: 16px; max-width: 880px; }
.msg { display: flex; flex-direction: column; max-width: 82%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant { align-self: flex-start; align-items: flex-start; }
.msg .role { font-size: 11px; color: var(--fg-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .03em; }
.msg .bubble { border-radius: 14px; padding: 12px 16px; }
.msg .bubble p:last-child { margin-bottom: 0; }
.msg.user .bubble { background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
.msg.user .bubble code { background: rgba(255,255,255,.18); color: inherit; }
.msg.assistant .bubble { background: var(--card-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }

@media (max-width: 760px) {
  .app-shell { grid-template-columns: 1fr; grid-template-areas: "header" "sidebar" "main"; }
  aside.sidebar { border-right: none; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; padding: 10px; }
  .step-item { flex-shrink: 0; }
  main.content { padding: 20px 16px; }
  .msg { max-width: 92%; }
  .live-indicator span:not(.dot) { display: none; }
}
</style>
</head>

      "Создать main.go, начинающийся с package main — только из этого пакета с функцией main() собирается исполняемый бинарник.",

    status: "current",
    summary: "Добавляем POST /register: принимаем JSON, проверяем данные и превращаем пароль в безопасный bcrypt-хеш.",
    objectives: [
      "Создать структуру для входящих данных регистрации: логин и пароль. Структура нужна, чтобы Go понимал, в какие поля раскладывать JSON.",

    snippets: [
      {
        label: "Структура входящего JSON",
        code: `type RegisterRequest struct {

    Password string \`json:"password"\`
}`,
        note: "Это не пользователь в базе, а форма входящих данных. Теги json связывают поля Go с ключами login и password в JSON."
      },
      {
        label: "Проверка HTTP-метода",
        code: `if r.Method != http.MethodPost {
    // вернуть ошибку 405
    return
}`,
        note: "Регистрация меняет данные, поэтому используем POST. return сразу прекращает выполнение обработчика после ошибки."

      {
        label: "Чтение JSON",
        code: `var data RegisterRequest
err := json.NewDecoder(r.Body).Decode(&data)`,

    verify: "Запустить сервер и отправить POST-запрос с JSON на /register. Корректные данные должны дать успешный ответ; пустой логин, короткий пароль, сломанный JSON и GET-запрос должны вернуть ошибки."

  {

  {

      { role: "user", text: 'Смотри, я хочу начать разбираться в golang намного больше, и при этом не хочу зубрить теорию (для меня это скучно и я быстро выгораю). Давай начнём писать проект авторизации, твоя задача — НЕ писать код, а объяснять, что мне нужно сделать, но делать это так, чтобы я понимал, что именно мне писать (потому что у меня проблемы с написанием кода с нуля, уже готовый код я +- читать могу, но написать самому — проблематично). Можешь показывать конструкции например написания, объяснять их и тому подобное, но не писать готовый код. Если есть вопросы, готов на них ответить' },

let notesState = loadNotes();
let activeId = localStorage.getItem(LS_ACTIVE) || STEPS.find(s => s.status === "current")?.id || STEPS[0].id;
let activeTab = localStorage.getItem(LS_TAB) || "roadmap";
let activeChatId = localStorage.getItem(LS_CHAT_ACTIVE) || (CHATS[0] && CHATS[0].id);

function stepIndex(id) { return STEPS.findIndex(s => s.id === id); }

function setTab(tab) { activeTab = tab; localStorage.setItem(LS_TAB, tab); render(); }

function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";

  const switcher = document.createElement("div");
  switcher.className = "tab-switcher";
  const roadmapBtn = document.createElement("button");
  roadmapBtn.className = "tab-btn" + (activeTab === "roadmap" ? " active" : "");
  roadmapBtn.textContent = "🗺️ Роадмап";
  roadmapBtn.addEventListener("click", () => setTab("roadmap"));
  const chatBtn = document.createElement("button");
  chatBtn.className = "tab-btn" + (activeTab === "chat" ? " active" : "");
  chatBtn.textContent = "💬 Чат";
  chatBtn.addEventListener("click", () => setTab("chat"));
  switcher.appendChild(roadmapBtn);
  switcher.appendChild(chatBtn);
  sidebar.appendChild(switcher);

  if (activeTab === "roadmap") {
    STEPS.forEach((step, i) => {
      const el = document.createElement("div");
      el.className = "step-item " + step.status + (step.id === activeId ? " active" : "");
      const num = document.createElement("div");
      num.className = "num";
      num.textContent = step.status === "done" ? "✓" : String(i + 1);
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = step.title.replace(/^\d+\.\s*/, "");
      el.appendChild(num);
      el.appendChild(label);
      el.addEventListener("click", () => { activeId = step.id; localStorage.setItem(LS_ACTIVE, activeId); render(); });
      sidebar.appendChild(el);
    });
  } else {
    CHATS.forEach(chat => {
      const el = document.createElement("div");
      el.className = "step-item" + (chat.id === activeChatId ? " active" : "");
      const num = document.createElement("div");
      num.className = "num";
      num.textContent = "💬";
      const label = document.createElement("div");
      label.className = "label";
      const titleEl = document.createElement("div");
      titleEl.textContent = chat.title;
      const dateEl = document.createElement("div");
      dateEl.style.cssText = "font-size:11px;color:var(--fg-muted);margin-top:2px;";
      dateEl.textContent = chat.date;
      label.appendChild(titleEl);
      label.appendChild(dateEl);
      el.appendChild(num);
      el.appendChild(label);
      el.addEventListener("click", () => { activeChatId = chat.id; localStorage.setItem(LS_CHAT_ACTIVE, activeChatId); render(); });
      sidebar.appendChild(el);
    });
    if (!CHATS.length) {
      const empty = document.createElement("p");
      empty.style.cssText = "color:var(--fg-muted);font-size:13px;padding:0 12px;";
      empty.textContent = "Чатов пока нет.";
      sidebar.appendChild(empty);
    }
  }
}

function renderMarkdownLite(text) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const parts = text.split(/```[a-zA-Z]*\n([\s\S]*?)```/g);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      html += "<pre><code>" + esc(part.replace(/\n$/, "")) + "</code></pre>";
      return;
    }
    let t = esc(part);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html += t.split(/\n\n+/)
      .filter(p => p.trim().length)
      .map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>")
      .join("");
  });
  return html;
}

function renderChatContent() {
  const chat = CHATS.find(c => c.id === activeChatId) || CHATS[0];
  const content = document.getElementById("content");
  content.innerHTML = "";
  if (!chat) {
    const p = document.createElement("p");
    p.textContent = "Чатов пока нет.";
    content.appendChild(p);
    return;
  }

  const header = document.createElement("div");
  header.className = "step-header";
  const h2 = document.createElement("h2");
  h2.textContent = chat.title;
  const badge = document.createElement("span");
  badge.className = "badge todo";
  badge.textContent = chat.date;
  header.appendChild(h2);
  header.appendChild(badge);
  content.appendChild(header);

  const thread = document.createElement("div");
  thread.className = "chat-thread";
  chat.messages.forEach(m => {
    const msg = document.createElement("div");
    msg.className = "msg " + m.role;
    const roleEl = document.createElement("div");
    roleEl.className = "role";
    roleEl.textContent = m.role === "user" ? "Ты" : "Наставник";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = renderMarkdownLite(m.text);
    msg.appendChild(roleEl);
    msg.appendChild(bubble);
    thread.appendChild(msg);
  });
  content.appendChild(thread);
}

function renderOverallProgress() {
  const done = STEPS.filter(s => s.status === "done").length;
  document.getElementById("overallFill").style.width = (done / STEPS.length * 100) + "%";
  document.getElementById("overallPct").textContent = `${done}/${STEPS.length} шагов`;
}

function badgeLabel(status) {
  if (status === "done") return "Пройдено";
  if (status === "current") return "Сейчас";
  return "Впереди";
}

function renderContent() {
  const step = STEPS.find(s => s.id === activeId);
  const content = document.getElementById("content");
  content.innerHTML = "";

  const header = document.createElement("div");
  header.className = "step-header";
  const h2 = document.createElement("h2");
  h2.textContent = step.title;
  const badge = document.createElement("span");
  badge.className = "badge " + step.status;
  badge.textContent = badgeLabel(step.status);
  header.appendChild(h2);
  header.appendChild(badge);
  content.appendChild(header);

  const summary = document.createElement("p");
  summary.className = "summary";
  summary.textContent = step.summary;
  content.appendChild(summary);

  if (step.objectives.length) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = "<h3>Что нужно сделать</h3>";
    const ol = document.createElement("ol");
    step.objectives.forEach(o => { const li = document.createElement("li"); li.textContent = o; ol.appendChild(li); });
    card.appendChild(ol);
    content.appendChild(card);
  }

  step.snippets.forEach(sn => {
    const card = document.createElement("div");
    card.className = "card";
    const h3 = document.createElement("h3");
    h3.textContent = sn.label;
    const pre = document.createElement("pre");
    const codeEl = document.createElement("code");
    codeEl.textContent = sn.code;
    pre.appendChild(codeEl);
    const note = document.createElement("p");
    note.className = "snippet-note";
    note.textContent = sn.note;
    card.appendChild(h3);
    card.appendChild(pre);
    card.appendChild(note);
    content.appendChild(card);
  });

  if (step.checklist.length) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = "<h3>Чек-лист</h3>";
    step.checklist.forEach(item => {
      const label = document.createElement("label");
      const checked = !!checklistState[item.id];
      label.className = "chk" + (checked ? " checked" : "");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = checked;
      input.addEventListener("change", () => {
        checklistState[item.id] = input.checked;
        saveChecklist(checklistState);
        label.classList.toggle("checked", input.checked);
      });
      const span = document.createElement("span");
      span.textContent = item.text;
      label.appendChild(input);
      label.appendChild(span);
      card.appendChild(label);
    });
    content.appendChild(card);
  }

  if (step.verify) {
    const verify = document.createElement("div");
    verify.className = "verify";
    verify.innerHTML = "<h3>Как проверить</h3>";
    const p = document.createElement("p");
    p.style.margin = "0";
    p.textContent = step.verify;
    verify.appendChild(p);
    content.appendChild(verify);
  }

  const notesCard = document.createElement("div");
  notesCard.className = "card";
  notesCard.innerHTML = "<h3>Мои заметки</h3>";
  const textarea = document.createElement("textarea");
  textarea.className = "notes";
  textarea.placeholder = "Вопросы, что не понятно, свои наблюдения...";
  textarea.value = notesState[step.id] || "";
  textarea.addEventListener("input", () => { notesState[step.id] = textarea.value; saveNotes(notesState); });
  notesCard.appendChild(textarea);
  content.appendChild(notesCard);

  const nav = document.createElement("div");
  nav.className = "nav-buttons";
  const idx = stepIndex(step.id);
  const prevBtn = document.createElement("button");
  prevBtn.className = "secondary";
  prevBtn.textContent = "← Назад";
  prevBtn.disabled = idx === 0;
  prevBtn.addEventListener("click", () => { activeId = STEPS[idx - 1].id; localStorage.setItem(LS_ACTIVE, activeId); render(); });
  const nextBtn = document.createElement("button");
  nextBtn.textContent = "Далее →";
  nextBtn.disabled = idx === STEPS.length - 1;
  nextBtn.addEventListener("click", () => { activeId = STEPS[idx + 1].id; localStorage.setItem(LS_ACTIVE, activeId); render(); });
  nav.appendChild(prevBtn);
  nav.appendChild(nextBtn);
  content.appendChild(nav);
}

function render() {
  renderSidebar();
  renderOverallProgress();
  if (activeTab === "chat") renderChatContent(); else renderContent();
}

document.getElementById("themeToggle").addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem(LS_THEME, next);
});
const savedTheme = localStorage.getItem(LS_THEME);
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

render();

setInterval(() => {
  const active = document.activeElement;
  if (active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) return;
  location.reload();
}, 30000);
</script>
</body>
</html>
